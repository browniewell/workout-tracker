name: Story
description: A small, shippable piece of work
title: "[S-XXX] "
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who wants this, and what does it get them?
      placeholder: As someone building a habit, I want … so that …
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's included.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then. These become the tests.
      placeholder: |
        - Given …, when …, then …
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: notes
    attributes:
      label: Notes
